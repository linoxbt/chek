name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Vectors and generated Move tests are up to date
        run: pnpm vectors:check

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enclave/chek-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: enclave/chek-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  move:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move/chek
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI (latest testnet release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R MystenLabs/sui --limit 100 --json tagName --jq '[.[].tagName | select(startswith("testnet-v"))][0]')
          echo "Using $tag"
          mkdir -p /tmp/sui
          gh release download "$tag" -R MystenLabs/sui --pattern "sui-$tag-ubuntu-x86_64.tgz" --dir /tmp/sui
          tar -xzf /tmp/sui/*.tgz -C /tmp/sui
          sudo install "$(find /tmp/sui -type f -name sui | head -1)" /usr/local/bin/sui
          sui --version
      - run: sui move build
      - run: sui move test
