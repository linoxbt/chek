name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Vectors and generated Move tests are up to date
        run: pnpm vectors:check

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enclave/chek-enclave/src/chek-core
    steps:
      - uses: actions/checkout@v4
      # enclave/chek-enclave/rust-toolchain.toml pins the toolchain for this crate too.
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: enclave/chek-enclave/src/chek-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  enclave:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enclave/chek-enclave/src/nautilus-server
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml in enclave/chek-enclave pins the template's toolchain.
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: enclave/chek-enclave/src/nautilus-server
      - run: cargo fmt --check
      - run: cargo clippy --locked --features chek --all-targets -- -D warnings
      - run: cargo test --locked --features chek

  move:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: move/chek
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        env:
          GH_TOKEN: ${{ github.token }}
          SUI_TAG: testnet-v1.85.1
        run: |
          tag="$SUI_TAG"
          mkdir -p /tmp/sui
          gh release download "$tag" -R MystenLabs/sui --pattern "sui-$tag-ubuntu-x86_64.tgz" --dir /tmp/sui
          tar -xzf /tmp/sui/*.tgz -C /tmp/sui
          sudo install "$(find /tmp/sui -type f -name sui | head -1)" /usr/local/bin/sui
          sui --version
      - run: sui move build
      - run: sui move test --gas-limit 100000000000
