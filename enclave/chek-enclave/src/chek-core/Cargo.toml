[package]
name = "chek-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Chek encoding shared by the enclave: canonical rules JSON, Blake2b-256, BCS leaves, Merkle tree"
publish = false

[dependencies]
bcs = "0.1"
blake2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
